[package]
name = "xterm_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.20.0"
nix = "0.26.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
env_logger = "0.11"
log = "0.4"

