[package]
name = "xterm-rs"
version = "0.1.0"
edition = "2021"
description = "A tiny Rust backend that streams a real PTY over WebSocket."

[[bin]]
name = "xterm-server"
path = "src/main.rs"

[dependencies]
hyper = { version = "0.14", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"
nix = { version = "0.27", features = ["term", "fs", "signal"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
structopt = "0.3"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
